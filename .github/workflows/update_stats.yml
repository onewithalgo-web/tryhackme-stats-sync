name: TryHackMe Stats Sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update README and practice log
        env:
          THM_USERNAME: ${{ secrets.THM_USERNAME }}
          THM_SESSION_COOKIE: ${{ secrets.THM_SESSION_COOKIE }}
        run: python main.py --local
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md practice-log.md
          git diff --cached --quiet || git commit -m "Auto-update TryHackMe stats [skip ci]"
          git push
